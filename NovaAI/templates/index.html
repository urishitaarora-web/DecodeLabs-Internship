<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="NovaAI - Intelligent AI Chat Assistant">

    <title>NovaAI</title>

    <!-- Google Font -->
     
    <link rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', filename='images/favicon.ico') }}">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/base.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/layout.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/chat.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/buttons.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/emoji.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/theme.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/animations.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/responsive.css') }}">

</head>

<body>

    <!-- Aurora Background -->

    <div class="aurora"></div>

    <!-- Mobile Backdrop Overlay -->

    <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>

    <!-- ===========================
         MAIN CONTAINER
    ============================ -->

    <div class="container">

        <!-- ===========================
             COLLAPSIBLE LEFT SIDEBAR
        ============================ -->

        <aside id="sidebar" class="sidebar" aria-label="NovaAI Navigation" aria-expanded="true">

            <div class="sidebar-header">

                <div class="sidebar-brand">
                    <img
                        src="{{ url_for('static', filename='images/nova-avatar.png') }}"
                        class="sidebar-logo"
                        alt="NovaAI">
                    <div class="sidebar-brand-text">
                        <h3>NovaAI</h3>
                        <span>Assistant</span>
                    </div>
                </div>

                <button
                    id="sidebarClose"
                    class="sidebar-close-btn"
                    title="Close Sidebar"
                    aria-label="Close Sidebar">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>

            <div class="sidebar-menu">

                <button
                    id="download"
                    class="sidebar-btn download-btn"
                    title="Download Chat"
                    aria-label="Download Chat">
                    <i class="fa-solid fa-file-arrow-down"></i>
                    <span class="sidebar-label">Download Chat</span>
                </button>

                <button
                    id="clear"
                    class="sidebar-btn clear-btn"
                    title="Clear Chat"
                    aria-label="Clear Chat">
                    <i class="fa-solid fa-trash-can"></i>
                    <span class="sidebar-label">Clear Chat</span>
                </button>

            </div>

            <div class="sidebar-footer">

                <button
                    id="sidebarToggle"
                    class="sidebar-btn toggle-btn"
                    title="Collapse Sidebar"
                    aria-label="Collapse Sidebar">
                    <i class="fa-solid fa-chevron-left" id="toggleIcon"></i>
                    <span class="sidebar-label">Collapse</span>
                </button>

            </div>

        </aside>

        <!-- ===========================
             CHAT WRAPPER (RIGHT SIDE)
        ============================ -->

        <div class="chat-wrapper">

            <!-- ===========================
                 HEADER
            ============================ -->

            <header>

                <div class="left">

                    <button
                        id="menuToggle"
                        class="menu-toggle"
                        title="Toggle Menu"
                        aria-label="Toggle Menu">
                        <i class="fa-solid fa-bars"></i>
                    </button>

                    <img
                        src="{{ url_for('static', filename='images/nova-avatar.png') }}"
                        class="logo"
                        alt="NovaAI">

                    <div>

                        <h2>NovaAI</h2>

                        <p>

                            <span class="online"></span>

                            Online

                        </p>

                    </div>

                </div>

                <div class="right">

                    <div id="clock"></div>

                    <button
                        id="themeBtn"
                        title="Toggle Theme">

                        🌙

                    </button>

                    <button
                        id="speakerBtn"
                        title="Speaker">

                        🔊

                    </button>

                </div>

            </header>

            <!-- ===========================
                 CHAT AREA
            ============================ -->

            <main id="chatArea">

                <div class="bot">

                    <img
                        src="{{ url_for('static', filename='images/nova-avatar.png') }}"
                        alt="Nova">

                    <div class="bubble welcome-bubble">

                        <h3>Hello 👋</h3>

                        <p>I'm NovaAI.<br>How can I help you today?</p>

                    </div>

                </div>

            </main>

            <!-- ===========================
                 TYPING
            ============================ -->

            <div id="typing">

                <div class="dot"></div>

                <div class="dot"></div>

                <div class="dot"></div>

            </div>

            <!-- ===========================
                 INPUT AREA
            ============================ -->

            <footer>

                <div class="emoji-container">

                    <button
                        id="emoji"
                        title="Emoji">

                        😊

                    </button>

                    <div
                        id="emojiPanel"
                        class="emoji-panel">

                    </div>

                </div>

                <button
                    id="voice"
                    title="Voice Input">

                    🎤

                </button>

                <input

                    id="message"

                    type="text"

                    placeholder="Ask NovaAI anything..."

                    autocomplete="off"

                    spellcheck="false">

                <button
                    id="send"
                    title="Send">

                    <i class="fa-solid fa-paper-plane"></i>

                </button>

            </footer>

        </div>

    </div>

    <!-- ===========================
         JAVASCRIPT
    ============================ -->

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

    <script src="{{ url_for('static', filename='js/clock.js') }}"></script>

    <script src="{{ url_for('static', filename='js/speech.js') }}"></script>

    <script src="{{ url_for('static', filename='js/emoji.js') }}"></script>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
