<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="NovaAI - Intelligent AI Chat Assistant">

    <title>NovaAI</title>

    <!-- Google Font -->
     
    <link rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', filename='images/favicon.ico') }}">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/base.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/layout.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/chat.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/buttons.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/emoji.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/theme.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/animations.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/responsive.css') }}">

</head>

<body>

    <!-- Aurora Background -->

    <div class="aurora"></div>

    <!-- ===========================
         MAIN CONTAINER
    ============================ -->

    <div class="container">

        <!-- ===========================
             HEADER
        ============================ -->

        <header>

            <div class="left">

                <img
                    src="{{ url_for('static', filename='images/nova-avatar.png') }}"
                    class="logo"
                    alt="NovaAI">

                <div>

                    <h2>NovaAI</h2>

                    <p>

                        <span class="online"></span>

                        Online

                    </p>

                </div>

            </div>

            <div class="right">

                <div id="clock"></div>

                <button
                    id="themeBtn"
                    title="Toggle Theme">

                    🌙

                </button>

                <button
                    id="speakerBtn"
                    title="Speaker">

                    🔊

                </button>

            </div>

        </header>

        <!-- ===========================
             CHAT AREA
        ============================ -->

        <main id="chatArea">

            <div class="bot">

                <img
                    src="{{ url_for('static', filename='images/nova-avatar.png') }}"
                    alt="Nova">

                <div class="bubble">

                    <h3>Hello 👋</h3>

                    <p>

                        I'm NovaAI.

                        <br><br>

                        How can I help you today?

                    </p>

                </div>

            </div>

        </main>

        <!-- ===========================
             TYPING
        ============================ -->

        <div id="typing">

            <div class="dot"></div>

            <div class="dot"></div>

            <div class="dot"></div>

        </div>

        <!-- ===========================
             INPUT AREA
        ============================ -->

        <footer>

            <div class="emoji-container">

                <button
                    id="emoji"
                    title="Emoji">

                    😊

                </button>

                <div
                    id="emojiPanel"
                    class="emoji-panel">

                </div>

            </div>

            <button
                id="voice"
                title="Voice Input">

                🎤

            </button>

            <input

                id="message"

                type="text"

                placeholder="Ask NovaAI anything..."

                autocomplete="off"

                spellcheck="false">

            <button
                id="send"
                title="Send">

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </footer>

        <!-- ===========================
             TOOLBAR
        ============================ -->

        <div class="toolbar">

            <button id="download">

                📄 Download Chat

            </button>

            <button id="clear">

                🗑 Clear Chat

            </button>

        </div>

    </div>

    <!-- ===========================
         JAVASCRIPT
    ============================ -->

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

    <script src="{{ url_for('static', filename='js/clock.js') }}"></script>

    <script src="{{ url_for('static', filename='js/speech.js') }}"></script>

    <script src="{{ url_for('static', filename='js/emoji.js') }}"></script>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
